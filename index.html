    <style>
        /* ===============================================================
        0. TYPEFACE
           =============================================================== */

        @font-face {
            font-family: "VCR OSD Mono";
            src: url("VCR_OSD_MONO_1.001.woff2") format("woff2"),
                 url("VCR_OSD_MONO_1.001.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap; /* Fall back rather than hide the digits */
        }

        /* ===============================================================
        1. LAYOUT & FRAMING (Standard Setup)
           =============================================================== /*

        /* Center the container on the page */
        .image-container {
            display: flex;
            justify-content: center; /* Horizontally centers the image */
            align-items: center;     /* Vertically centers the image */
            min-height: 100vh;       /* Gives the container height to allow vertical centering */
            width: 100%;             /* Ensures container stretches full width */
        }

        /* Create a relative frame for the two stacked images */
        .hover-wrapper {
            position: relative;
            width: 66.67%;
            max-width: 750px; /* Limits the desktop size */
            height: auto;
            opacity: 0;
            animation: pageLoadFade 2s ease-in-out forwards; /* Fade-in on page load */
            cursor: pointer;
        }

        /* Style both images so they are responsive and identical */
        /* <picture> is inline by default; keep the frame's geometry exact */
        .hover-wrapper picture {
            display: block;
        }

        .hover-layer-container picture {
            width: 100%;
            height: 100%;
        }

        .base-img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 1.2s ease-in-out;
        }

        /* The reveal is one-way: the artwork dissolves to black and stays there */
        .hover-wrapper.revealed .base-img {
            opacity: 0;
        }

        .hover-wrapper.revealed .hover-layer-container,
        .hover-wrapper.revealed:hover .hover-layer-container {
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        /* ===============================================================
        2. LAYER A: BOX CONTAINER (Handles Entry & Exit Speeds)
           =============================================================== */

        .hover-layer-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0; /* Hidden by default */
        
        /* DEFAULT EXIT: Takes 1.5 seconds to smoothly fade out on mouse leave */
        transition: opacity 1.5s ease-in-out; 
        }

        /* When hovered, change to the entry transition rules */
        .hover-wrapper:hover .hover-layer-container {
            opacity: 1;
            
            /* FAST ENTRY: Takes only 0.5 seconds to fade in on mouse enter */
            transition: opacity 0.5s ease-in-out; 
        }

        /* ================================================================
        3. LAYER B: THE IMAGE INSIDE (Handles the Flickering)
           ================================================================ */

        img.hover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            
            /* The image flickers infinitely in the background between 0.7 and 1.0.
            Because it runs constantly inside a hidden container, there is 
            NEVER any start delay when the user hovers! */
            animation: flickerEffect 5s ease-in-out infinite;
        }

        @keyframes flickerEffect {
            0% { opacity: 0.7; }
            15% { opacity: 0.9; }
            25% { opacity: 0.65; }
            40% { opacity: 0.85; }
            55% { opacity: 1; }
            70% { opacity: 0.75; }
            80% { opacity: 0.95; }
            90% { opacity: 0.6; }
            100% { opacity: 0.7; }
        }

        @keyframes pageLoadFade {
            0% { opacity: 0 }
            100% {opacity: 1 }
        }

        /* ================================================================
        4. LAYER C: THE COUNTDOWN (Revealed on click)
           ================================================================ */

        /* LAYER: fills the frame and centers the timer on both axes */
        .countdown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;

            display: flex;
            align-items: center;     /* Vertical centering */
            justify-content: center; /* Horizontal centering */

            /* Clicks fall through to the wrapper so the artwork stays clickable */
            pointer-events: none;

            opacity: 0;

            /* Waits for the artwork to darken before fading up */
            transition: opacity 0.8s ease-in-out 0.6s;
        }

        .hover-wrapper.revealed .countdown {
            opacity: 1;
        }

        /* INNER: the flicker lives here, so it never fights the fade above */
        .countdown-value {
            font-family: "VCR OSD Mono", "SF Mono", "Menlo", "Consolas", monospace;
            font-size: clamp(0.62rem, 3.1vw, 1.6rem);
            letter-spacing: 0.08em;
            color: #ffffff;
            white-space: nowrap;
            animation: flickerEffect 5s ease-in-out infinite;
        }

        /* Target tag <body> and set margin to 0 so the page doesn't scroll */
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
        }

    </style>
</head>
<body>
    <div class="image-container">
        <div class="hover-wrapper" id="wrapper">

            <picture>
                <source srcset="possessor_default.webp" type="image/webp">
                <img src="possessor_default-fallback.png" class="base-img"
                     width="1500" height="1500" alt="lariat.systems">
            </picture>
            
            <div class="hover-layer-container">

                <picture>
                    <source srcset="possessor_mouseover.webp" type="image/webp">
                    <img src="possessor_mouseover-fallback.png" class="hover-img"
                         width="1500" height="1500" alt="">
                </picture>

            </div>

            <div class="countdown">
                <span class="countdown-value" id="countdown">0000.00.00.00.00.00.00</span>
            </div>

        </div>
    </div>

    <script>
        // Release: the stroke of midnight ending Friday, Sept 12 2026, pinned to
        // Pacific (-07:00) so the drop lands at the same instant everywhere.
        var RELEASE = new Date("2026-09-12T00:00:00-07:00");
        var STORE = "https://lariatsystems.bandcamp.com/";

        var wrapper = document.getElementById("wrapper");
        var countdown = document.getElementById("countdown");
        var frame = null;

        function pad(n, width) {
            n = String(n);
            while (n.length < width) { n = "0" + n; }
            return n;
        }

        // Calendar-aware remainder, so the yyyy.mm.dd segments mean real years
        // and months rather than an averaged approximation.
        function remaining(from, to) {
            var y = to.getFullYear() - from.getFullYear();
            var mo = to.getMonth() - from.getMonth();
            var d = to.getDate() - from.getDate();
            var h = to.getHours() - from.getHours();
            var mi = to.getMinutes() - from.getMinutes();
            var s = to.getSeconds() - from.getSeconds();
            var ms = to.getMilliseconds() - from.getMilliseconds();

            if (ms < 0) { ms += 1000; s -= 1; }
            if (s < 0) { s += 60; mi -= 1; }
            if (mi < 0) { mi += 60; h -= 1; }
            if (h < 0) { h += 24; d -= 1; }
            if (d < 0) {
                // Borrow the length of the month preceding the target date
                d += new Date(to.getFullYear(), to.getMonth(), 0).getDate();
                mo -= 1;
            }
            if (mo < 0) { mo += 12; y -= 1; }

            return [pad(y, 4), pad(mo, 2), pad(d, 2), pad(h, 2),
                    pad(mi, 2), pad(s, 2), pad(Math.floor(ms / 10), 2)].join(".");
        }

        function released() {
            return Date.now() >= RELEASE.getTime();
        }

        function tick() {
            if (released()) {
                countdown.textContent = "0000.00.00.00.00.00.00";
                frame = null;
                return; // Held at zero; the artwork now opens the store
            }
            countdown.textContent = remaining(new Date(), RELEASE);
            frame = requestAnimationFrame(tick);
        }

        // ---- Background loop -------------------------------------------
        // Opus in WebM is the supplied file remuxed, not re-encoded, so it
        // decodes bit-identical and its header pre-skip is stripped by the
        // decoder. The m4a is a transcode kept only as a fallback.
        //
        // Each pass is scheduled as its own source on the audio clock rather
        // than relying on AudioBufferSourceNode.loop, which was verified in
        // Chrome to play this buffer once and then fall silent. Scheduling
        // ahead on the audio clock is sample-accurate, so passes still butt
        // up against each other with no seam.
        var LOOP_SRC = (function () {
            var probe = document.createElement("audio");
            return (probe.canPlayType && probe.canPlayType('audio/webm; codecs="opus"'))
                ? "loop.webm" : "loop.m4a";
        })();

        // The bed peaks at about -32 dBFS on its own, which is inaudible on
        // most speakers. This lifts it to roughly -26 dBFS. Raise or lower
        // this one number to set its level; each doubling is +6 dB.
        var LOOP_GAIN = 2;

        var LOOKAHEAD = 2.0;   // seconds of passes queued ahead; survives the
        var PUMP_MS = 500;     // 1s timer throttling of a backgrounded tab

        // Held at this scope on purpose: a context or node referenced only
        // inside a callback can be collected mid-playback.
        var audioCtx = null;
        var audioBuf = null;
        var audioGain = null;
        var audioEl = null;
        var audioTimer = null;
        var nextPassAt = 0;
        var audioPlaying = false;
        var audioLoading = false;

        function pump() {
            if (!audioCtx || !audioBuf) { return; }
            var now = audioCtx.currentTime;
            // Realign after a suspension rather than firing a burst of
            // overlapping passes scheduled in the past.
            if (nextPassAt < now) { nextPassAt = now + 0.02; }
            while (nextPassAt < now + LOOKAHEAD) {
                var s = audioCtx.createBufferSource();
                s.buffer = audioBuf;
                s.connect(audioGain);
                s.start(nextPassAt);
                nextPassAt += audioBuf.duration;
            }
        }

        function playFallback() {
            if (audioEl) { return; }
            audioEl = new Audio(LOOP_SRC);
            audioEl.loop = true;
            audioEl.addEventListener("ended", function () {
                audioEl.currentTime = 0;
                audioEl.play().catch(function () {});
            });
            audioEl.play().then(function () {
                audioPlaying = true;
                releaseGestures();
            }).catch(function () { audioEl = null; });
        }

        function startLoop() {
            if (audioPlaying || audioLoading) { return; }
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) { playFallback(); return; }

            if (!audioCtx) { audioCtx = new AC(); }
            if (audioCtx.state === "suspended") { audioCtx.resume(); }

            audioLoading = true;
            var settled = false;
            var giveUp = setTimeout(function () {
                if (settled) { return; }
                settled = true;
                audioLoading = false;
                playFallback();
            }, 5000);

            fetch(LOOP_SRC)
                .then(function (r) { return r.arrayBuffer(); })
                .then(function (ab) {
                    return new Promise(function (res, rej) {
                        // callback form: older Safari returns no promise
                        var p = audioCtx.decodeAudioData(ab, res, rej);
                        if (p && p.then) { p.then(res, rej); }
                    });
                })
                .then(function (buf) {
                    if (settled) { return; }
                    settled = true;
                    clearTimeout(giveUp);
                    audioLoading = false;
                    audioBuf = buf;
                    audioGain = audioCtx.createGain();
                    audioGain.gain.value = LOOP_GAIN;
                    audioGain.connect(audioCtx.destination);
                    nextPassAt = audioCtx.currentTime + 0.05;
                    pump();
                    audioTimer = setInterval(pump, PUMP_MS);
                    audioPlaying = true;
                    releaseGestures();
                })
                .catch(function () {
                    if (settled) { return; }
                    settled = true;
                    clearTimeout(giveUp);
                    audioLoading = false;
                    playFallback();
                });
        }

        // Sound needs a gesture. Listeners stay until something actually
        // plays, so a blocked first attempt is retried rather than latched.
        var GESTURES = ["pointerdown", "keydown", "touchstart"];
        function onGesture() { startLoop(); }
        function releaseGestures() {
            GESTURES.forEach(function (ev) {
                document.removeEventListener(ev, onGesture);
            });
        }
        GESTURES.forEach(function (ev) {
            document.addEventListener(ev, onGesture, { passive: true });
        });

        // A backgrounded tab suspends the context and throttles the pump;
        // resume and top the queue up straight away on return.
        document.addEventListener("visibilitychange", function () {
            if (document.hidden || !audioCtx) { return; }
            if (audioCtx.state === "suspended") { audioCtx.resume(); }
            pump();
        });

        wrapper.addEventListener("click", function () {
            if (released()) {
                window.location.href = STORE;
                return;
            }
            if (wrapper.classList.contains("revealed")) {
                return; // One-way: the countdown does not dismiss
            }
            wrapper.classList.add("revealed");
            tick();
        });
    </script>
